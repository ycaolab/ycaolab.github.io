<aside class="news-box">
  <h2 class="news-title">Latest news</h2>
  <ul class="news-list">
  {% for article in site.data.news limit:8 %}
    <li class="news-item">
      <span class="news-date">{{ article.date }}</span>
      <div class="news-text">{{ article.headline | markdownify }}</div>
    </li>
  {% endfor %}
  </ul>
  <p class="news-more"><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">All news &rarr;</a></p>
</aside>
