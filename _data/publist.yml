- title: "Humans use a dual policy to improve inferences during epistemic information seeking"
  year: 2026
  topics: [Information seeking/sampling, Computational modeling, Neural network models]
  venue: Nature Human Behaviour (in press)
  authors: Yinan Cao, Clémence Alméras, Junseok K. Lee, Inès Maye, Valentin Wyart
  featured: 1
